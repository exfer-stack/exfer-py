[build-system]
requires      = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name            = "exfer-walletd"
dynamic         = ["version"]
description     = "Typed Python client for the exfer-walletd JSON-RPC API"
readme          = "README.md"
license         = { text = "MIT" }
requires-python = ">=3.9,<3.14"
authors         = [{ name = "exfer-stack" }]
keywords        = ["exfer", "walletd", "wallet", "json-rpc", "crypto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage   = "https://github.com/exfer-stack/exfer-py"
Repository = "https://github.com/exfer-stack/exfer-py"
"Bug Tracker" = "https://github.com/exfer-stack/exfer-py/issues"
"exfer-walletd (Rust daemon)" = "https://github.com/exfer-stack/exfer-walletd"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10,<2.0",
    "ruff>=0.5",
]

[tool.hatch.version]
path = "src/exfer_walletd/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exfer_walletd"]

[tool.hatch.build.targets.sdist]
include = [
    "src/exfer_walletd",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.ruff]
line-length    = 100
target-version = "py39"
src            = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # ruff format handles line length; this only fires on long strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # `assert False` is fine in tests

[tool.mypy]
python_version          = "3.9"
strict                  = true
warn_unreachable        = true
disallow_any_unimported = true
files                   = ["src/exfer_walletd"]

[[tool.mypy.overrides]]
module                 = ["respx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths   = ["tests"]
pythonpath  = ["src"]
asyncio_mode = "auto"
markers = [
    "integration: tests that spawn a real exfer-walletd binary",
    "requires_node: tests that need a live exfer node",
]
