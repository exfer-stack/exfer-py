name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy
        run: mypy src

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: pytest
        run: pytest -q -m "not integration"

  integration:
    name: integration (real walletd)
    runs-on: ubuntu-latest
    needs: [lint-and-type, test]
    # Only on main pushes — building walletd from source on every PR
    # (especially from forks where we'd need extra perms) is too much.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          path: exfer-py

      - name: Check out exfer-walletd
        uses: actions/checkout@v4
        with:
          repository: exfer-stack/exfer-walletd
          ref: v0.7.0
          path: exfer-walletd

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: exfer-walletd

      - name: Build walletd
        working-directory: exfer-walletd
        run: cargo build --release --bin exfer-walletd

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SDK
        working-directory: exfer-py
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Integration tests
        working-directory: exfer-py
        env:
          WALLETD_BINARY: ${{ github.workspace }}/exfer-walletd/target/release/exfer-walletd
        run: pytest -q -m integration
